<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Chavalina</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f4f5f0]">

    <div class="min-h-screen flex items-center justify-center px-4">

        <div class="w-full max-w-md">

            <!-- LOGO -->
            <div class="text-center mb-8">

                <div
                    class="w-20 h-20 bg-white rounded-2xl
                           flex items-center justify-center
                           mx-auto mb-4 p-2 shadow-sm"
                >
                    <img
                        src="{{ url_for('static', filename='img/logo-chavalina.png') }}"
                        alt="Central Chavalina"
                        class="w-full h-full object-contain"
                    >
                </div>

                <h1 class="text-3xl font-bold text-[#1d3515]">
                    Central Chavalina
                </h1>

                <p class="text-gray-500 mt-2">
                    Panel Administrativo
                </p>

            </div>


            <!-- FORMULARIO -->
            <div
                class="bg-white border border-gray-200
                       rounded-2xl shadow-sm p-8"
            >

                <div class="mb-6">

                    <h2 class="text-xl font-bold text-[#1d3515]">
                        Iniciar sesión
                    </h2>

                    <p class="text-sm text-gray-500 mt-1">
                        Ingresa tus datos para acceder al panel.
                    </p>

                </div>


                {% if error %}

                <div
                    class="mb-5 p-4 rounded-xl
                           bg-red-50 border border-red-200
                           text-sm text-red-600"
                >
                    {{ error }}
                </div>

                {% endif %}


                <form method="POST">

                    <!-- USUARIO -->
                    <div class="mb-5">

                        <label
                            for="usuario"
                            class="block text-sm font-semibold
                                   text-gray-700 mb-2"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            required
                            autocomplete="username"
                            placeholder="Ingresa tu usuario"
                            class="w-full px-4 py-3
                                   border border-gray-200
                                   rounded-xl outline-none
                                   focus:border-[#87b848]
                                   focus:ring-2
                                   focus:ring-[#87b848]/20"
                        >

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="mb-6">

                        <label
                            for="password"
                            class="block text-sm font-semibold
                                   text-gray-700 mb-2"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            placeholder="Ingresa tu contraseña"
                            class="w-full px-4 py-3
                                   border border-gray-200
                                   rounded-xl outline-none
                                   focus:border-[#87b848]
                                   focus:ring-2
                                   focus:ring-[#87b848]/20"
                        >

                    </div>


                    <!-- BOTÓN -->
                    <button
                        type="submit"
                        class="w-full py-3 px-4
                               bg-[#1d3515] text-white
                               rounded-xl font-semibold
                               hover:bg-[#294b1e]
                               transition"
                    >
                        Ingresar
                    </button>

                </form>

            </div>


            <!-- VOLVER A LA WEB -->
            <div class="text-center mt-6">

                <a
                    href="{{ url_for('public.home') }}"
                    class="text-sm font-semibold
                           text-[#1d3515]
                           hover:underline"
                >
                    ← Volver a la página web
                </a>

            </div>

        </div>

    </div>

</body>

</html>
